<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse — offline</title>
<style>
  :root{--paper:#F5F2EB;--ink:#1A1813;--muted:#58533F;--br:#1E75B9;--line:#E4DFD2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;
    padding:24px env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .card{max-width:360px;text-align:center}
  .mark{width:40px;height:40px;border-radius:11px;background:var(--br);color:#fff;display:grid;
    place-items:center;font-family:ui-monospace,monospace;font-size:18px;margin:0 auto 20px}
  h1{font-size:20px;font-weight:600;margin:0 0 10px;letter-spacing:-.02em}
  p{font-size:14.5px;color:var(--muted);line-height:1.55;margin:0 0 22px}
  button{font:inherit;font-size:14px;font-weight:500;color:#fff;background:var(--br);
    border:none;border-radius:999px;padding:10px 22px;cursor:pointer}
  button:hover{opacity:.92}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">P</div>
    <h1>No connection right now</h1>
    <p>Pulse needs a live connection to show real sales data — it never shows a cached
       or stale answer in its place. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
